<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#8c1d24">
  <title>Trace Lock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --base: #8c1d24;
      --accent: #ffb347;
      --accent-soft: #ffd08a;
      --text: #fff4f0;
      --muted: #ffd3cc;
      --line: #ffe3de;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--base);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(1.2rem, env(safe-area-inset-top))
        max(1.2rem, env(safe-area-inset-right))
        max(1.2rem, env(safe-area-inset-bottom))
        max(1.2rem, env(safe-area-inset-left));
    }

    /* ---------- Glitchy dark red background ---------- */
    .bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      background:
        radial-gradient(circle at 50% 35%, #b02530 0%, #8c1d24 55%, #7a1a22 100%);
      animation: flicker 5s steps(1) infinite;
    }

    /* scanlines */
    .bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.07) 0px,
        rgba(255, 255, 255, 0.07) 1px,
        transparent 1px,
        transparent 4px
      );
      pointer-events: none;
    }

    /* slow rolling band, like a bad CRT refresh */
    .bg::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 22%;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(255, 120, 110, 0.22),
        transparent
      );
      animation: roll 6s linear infinite;
      pointer-events: none;
    }

    @keyframes roll {
      from { top: -25%; }
      to   { top: 110%; }
    }

    @keyframes flicker {
      0%, 100% { filter: brightness(1); }
      42%      { filter: brightness(1.12); }
      43%      { filter: brightness(0.92); }
      44%      { filter: brightness(1); }
      78%      { filter: brightness(1.18) saturate(1.15); }
      79%      { filter: brightness(1); }
    }

    #noise {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.16;
      mix-blend-mode: screen;
      image-rendering: pixelated;
      pointer-events: none;
    }

    .slice {
      position: absolute;
      left: -5%;
      width: 110%;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    /* ---------- Layout ---------- */
    .stage {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
      text-align: center;
    }

    /* ---------- Logo ---------- */
    .logo {
      width: 120px;
      height: 120px;
      overflow: visible;
      filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.35));
    }

    .logo .ring {
      fill: none;
      stroke: var(--line);
      stroke-width: 4;
      stroke-dasharray: 340;
      stroke-dashoffset: 340;
      animation: draw 1.4s ease-out forwards;
    }

    .logo .cross {
      fill: none;
      stroke: var(--accent);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: draw 0.6s ease-out 0.9s forwards;
    }

    .logo .dot {
      fill: var(--accent);
      opacity: 0;
      transform-origin: 60px 60px;
      animation: pop 0.4s ease-out 1.4s forwards;
    }

    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pop {
      0% { opacity: 0; transform: scale(0.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* ---------- Title with glitch jitter ---------- */
    h1 {
      position: relative;
      font-size: 2rem;
      letter-spacing: 0.04em;
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
      animation: titleGlitch 4.5s steps(1) infinite;
    }

    h1 span { color: var(--accent); }

    @keyframes titleGlitch {
      0%, 90%, 100% { transform: none; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35); }
      91% { transform: translate(-3px, 0); text-shadow: 3px 0 #ff5d6c, -3px 0 #ffd08a; }
      92% { transform: translate(4px, 1px); text-shadow: -4px 0 #ff5d6c, 4px 0 #ffd08a; }
      93% { transform: translate(-2px, -1px); text-shadow: 2px 0 #ff5d6c, -2px 0 #ffd08a; }
      94% { transform: none; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35); }
    }

    .tagline {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.4;
      margin-top: -0.8rem;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
    }

    /* ---------- Loading bar ---------- */
    #loading {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    #loading.gone {
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
    }

    .bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 99px;
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-soft));
      border-radius: 99px;
    }

    #status {
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      min-height: 1.1em;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
    }

    /* ---------- Launch button ---------- */
    #launch {
      display: none;
      width: 100%;
      padding: 1rem 1.2rem;
      border-radius: 14px;
      background: var(--accent);
      color: #4a1216;
      font-size: 1.15rem;
      font-weight: 700;
      font-family: inherit;
      text-decoration: none;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      transition: transform 0.1s ease, background 0.15s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    #launch.show {
      display: block;
      animation: rise 0.5s ease-out both;
    }

    #launch:active {
      transform: scale(0.97);
      background: var(--accent-soft);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="bg" id="bg" aria-hidden="true">
    <canvas id="noise" width="160" height="160"></canvas>
  </div>

  <main class="stage">
    <svg class="logo" viewBox="0 0 120 120" aria-hidden="true">
      <circle class="ring" cx="60" cy="60" r="54"></circle>
      <path class="cross" d="M60 18 V42 M60 78 V102 M18 60 H42 M78 60 H102"></path>
      <circle class="dot" cx="60" cy="60" r="6"></circle>
    </svg>

    <h1>Trace <span>Lock</span></h1>
    <p class="tagline">Pin a reference photo to your screen and trace without it moving.</p>

    <div id="loading">
      <div class="bar"><i id="fill"></i></div>
      <p id="status">Warming up</p>
    </div>

    <a id="launch" href="Trace%20Lock.html">Launch</a>
  </main>

  <script>
    (function () {
      var reduceMotion = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // ---------- Glitch background ----------
      var bg = document.getElementById('bg');
      var noise = document.getElementById('noise');
      var nctx = noise.getContext('2d');
      var SLICE_COLORS = [
        'rgba(255, 90, 100, 0.35)',
        'rgba(200, 40, 55, 0.5)',
        'rgba(255, 150, 130, 0.28)',
        'rgba(120, 15, 25, 0.55)'
      ];

      function drawNoise() {
        var w = noise.width, h = noise.height;
        var img = nctx.createImageData(w, h);
        var d = img.data;
        for (var i = 0; i < d.length; i += 4) {
          var v = Math.random() * 255;
          d[i] = v;
          d[i + 1] = v * 0.35;
          d[i + 2] = v * 0.35;
          d[i + 3] = Math.random() < 0.5 ? 0 : 255;
        }
        nctx.putImageData(img, 0, 0);
      }

      function spawnSlice() {
        var s = document.createElement('div');
        s.className = 'slice';
        var top = Math.random() * 100;
        var h = 1 + Math.random() * 9;
        var shift = (Math.random() - 0.5) * 60;
        s.style.top = top + '%';
        s.style.height = h + '%';
        s.style.background = SLICE_COLORS[Math.floor(Math.random() * SLICE_COLORS.length)];
        s.style.transform = 'translateX(' + shift + 'px)';
        bg.appendChild(s);
        setTimeout(function () { s.remove(); }, 70 + Math.random() * 160);
      }

      function glitchLoop() {
        var count = 1 + Math.floor(Math.random() * 3);
        for (var i = 0; i < count; i++) spawnSlice();
        // occasional heavy burst
        if (Math.random() < 0.12) {
          for (var j = 0; j < 6; j++) spawnSlice();
        }
        setTimeout(glitchLoop, 120 + Math.random() * 380);
      }

      drawNoise();
      if (!reduceMotion) {
        setInterval(drawNoise, 110);
        glitchLoop();
      }

      // ---------- Loading sequence ----------
      var fill = document.getElementById('fill');
      var status = document.getElementById('status');
      var loading = document.getElementById('loading');
      var launch = document.getElementById('launch');

      var steps = [
        { at: 0,  text: 'Warming up' },
        { at: 30, text: 'Locking the grid' },
        { at: 60, text: 'Calibrating the screen' },
        { at: 90, text: 'Ready' }
      ];

      var DURATION = 2200;
      var startTime = null;

      function tick(now) {
        if (startTime === null) startTime = now;
        var raw = Math.min((now - startTime) / DURATION, 1);
        var p = 1 - Math.pow(1 - raw, 2.2);
        var pct = p * 100;
        fill.style.width = pct + '%';

        for (var i = steps.length - 1; i >= 0; i--) {
          if (pct >= steps[i].at) { status.textContent = steps[i].text; break; }
        }

        if (raw < 1) {
          requestAnimationFrame(tick);
        } else {
          setTimeout(showLaunch, 250);
        }
      }

      function showLaunch() {
        loading.classList.add('gone');
        setTimeout(function () {
          loading.style.display = 'none';
          launch.classList.add('show');
        }, 350);
      }

      // Tap the loading bar to skip ahead
      loading.addEventListener('click', function () { startTime = -Infinity; });

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
